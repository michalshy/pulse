[package]
name = "pulse-agent"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
reqwest = { version = "0.13.2", features = ["json"] }
toml = "1.1.0"
serde ={ version = "*", features = ["derive"]}
tonic = "0.14.5"
prost = "0.14.3"
tonic-prost = "0.14.5"

[build-dependencies]
tonic-prost-build = "0.14.5"