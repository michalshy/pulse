services:
  # the application instance being observed
  backend-app:
    build: ./backend
    ports:
      - "8080:8080"
    volumes:
      - app-data:/data
      - app-logs:/var/log/backend
    environment:
      - DUCKDB_PATH=/data/observability.db
      - LOG_PATH=/var/log/backend/app.log
      - PORT=8080

  # the observability instance (dogfooding)
  backend-obs:
    build: ./backend
    ports:
      - "8081:8080"
    volumes:
      - obs-data:/data
    environment:
      - DUCKDB_PATH=/data/observability.db
      - PORT=8080

  # agent watches the app instance, ships to the obs instance
  agent:
    build: ./agent
    volumes:
      - app-logs:/var/log/watched:ro
    environment:
      - WATCH_FILES=/var/log/watched/app.log
      - BACKEND_URL=http://backend-obs:8080
      - AGENT_ID=dogfood-agent-1
    depends_on:
      - backend-app
      - backend-obs

  dashboard:
    build: ./dashboard
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:8081

volumes:
  app-data:
  obs-data:
  app-logs:
